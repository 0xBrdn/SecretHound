[package]
name = "secrethound"
version = "0.1.0"
edition = "2021"
authors = ["0xBrdn"]
description = "Ultra-fast static secrets scanner written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xBrdn/secrethound"
keywords = ["secrets", "scanner", "security", "devsecops", "gitignore"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
ignore = "0.4.34"
rayon = "1.12.0"
colored = "3.1.1"
indicatif = "0.18.6"
comfy-table = "8.0.1"
