[package]
name = "secrethound"
version = "0.3.0"
edition = "2021"
authors = ["0xBrdn"]
description = "Ultra-fast static secrets scanner written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xBrdn/secrethound"
keywords = ["secrets", "scanner", "security", "devsecops", "gitignore"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.75"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
ignore = "0.4"
rayon = "1.10"
colored = "2.1"
indicatif = "0.17"
comfy-table = "7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
